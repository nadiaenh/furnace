name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: pulumi/actions@v7

      - run: pnpm install
      - run: cd broker && pnpm install --prod --config.node-linker=hoisted

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vm-service-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: pulumi login
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${account_id}"
          pulumi login "s3://vm-service-pulumi-state-${account_id}?region=${{ env.AWS_REGION }}"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: pulumi up
        run: |
          pulumi stack select dev
          pulumi config set --secret apiKey "$API_KEY"
          pulumi up --yes
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "deploy-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" --title "Deploy ${GITHUB_SHA::7}" --notes "Automated deploy of ${GITHUB_SHA}" --target "${GITHUB_SHA}"
