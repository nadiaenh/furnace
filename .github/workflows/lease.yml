name: Check a VM lease end to end

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lease-check
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2

jobs:
  lease-and-release:
    name: Lease a VM, reach workload and release it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Pulumi CLI
        uses: pulumi/actions@v7

      - name: Install dependencies
        run: pnpm install

      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/furnace-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log Pulumi into S3 backend
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${account_id}"
          pulumi login "s3://furnace-pulumi-state-${account_id}?region=${AWS_REGION}"

      - name: Read broker URL from Pulumi stack
        id: stack
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi stack select dev
          url=$(pulumi stack output brokerUrl 2>/dev/null || true)
          if [ -n "$url" ]; then
            echo "broker_url=$url" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::brokerUrl stack output is unset; deploy the stack first."
          fi

      - name: Lease a VM from broker
        id: lease
        if: steps.stack.outputs.ready == 'true'
        env:
          BROKER_URL: ${{ steps.stack.outputs.broker_url }}
        run: |
          resp=$(curl -sf -X POST "${BROKER_URL}lease" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            --aws-sigv4 "aws:amz:${AWS_REGION}:lambda" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}")
          echo "$resp" | jq -e .instanceId > /dev/null
          echo "instance_id=$(echo "$resp" | jq -r .instanceId)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(echo "$resp" | jq -r .publicIp)" >> "$GITHUB_OUTPUT"
          echo "$resp" | jq -r .sshKey > key.pem
          chmod 600 key.pem

      - name: Confirm SSH access to instance
        if: steps.lease.outputs.instance_id != ''
        env:
          IP: ${{ steps.lease.outputs.public_ip }}
        run: |
          for i in $(seq 1 18); do
            if ssh -i key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 "ec2-user@$IP" true 2>/dev/null; then
              echo "ssh reachable after $((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "::error::SSH never became reachable"; exit 1

      - name: Wait for workload to answer on port 8080
        if: steps.lease.outputs.instance_id != ''
        env:
          IP: ${{ steps.lease.outputs.public_ip }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://$IP:8080"; then
              echo "workload up after $((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "::error::workload port 8080 never answered"; exit 1

      - name: Release VM
        if: always() && steps.lease.outputs.instance_id != ''
        env:
          BROKER_URL: ${{ steps.stack.outputs.broker_url }}
          INSTANCE_ID: ${{ steps.lease.outputs.instance_id }}
        run: |
          curl -sf -X POST "${BROKER_URL}release" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            --aws-sigv4 "aws:amz:${AWS_REGION}:lambda" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            -d "{\"instanceId\": \"${INSTANCE_ID}\"}" || echo "::warning::release call failed; the lease will expire on its own"
